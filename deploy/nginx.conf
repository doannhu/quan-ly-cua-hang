# nginx site for running without Docker.
# Install: cp deploy/nginx.conf /etc/nginx/sites-available/quan-ly-cua-hang
#          ln -s /etc/nginx/sites-available/quan-ly-cua-hang /etc/nginx/sites-enabled/
server {
  listen 80;
  server_name _;            # replace with your domain if you have one
  client_max_body_size 20m; # photo uploads

  root /var/www/quan-ly-cua-hang;  # output of `npm run build` in frontend/
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /uploads/ {
    proxy_pass http://127.0.0.1:4000;
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
